name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar proyecto (descomprime el ZIP solo dentro del runner)
        id: prj
        shell: bash
        run: |
          set -e
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' -not -path './_proj/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then echo "No hay proyecto ni ZIP en el repositorio"; exit 1; fi
            mkdir -p _proj
            unzip -q -o "$ZIP" -d _proj
            SETTINGS=$(find _proj -name settings.gradle.kts | head -n 1)
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto en: $DIR"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: ${{ steps.prj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: OtgRescue-apk
          path: ${{ steps.prj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
